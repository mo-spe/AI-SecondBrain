<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981" />
      <stop offset="100%" style="stop-color:#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGradient)" />

  <!-- 神经网络 / 知识图谱图标 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 连接线 -->
    <line x1="44" y1="44" x2="64" y2="64" />
    <line x1="84" y1="44" x2="64" y2="64" />
    <line x1="64" y1="64" x2="44" y2="84" />
    <line x1="64" y1="64" x2="84" y2="84" />
    <line x1="44" y1="44" x2="44" y2="84" opacity="0.4" />
    <line x1="84" y1="44" x2="84" y2="84" opacity="0.4" />
    <line x1="44" y1="44" x2="84" y2="44" opacity="0.3" />
    <line x1="44" y1="84" x2="84" y2="84" opacity="0.3" />
  </g>

  <!-- 节点 -->
  <circle cx="44" cy="44" r="7" fill="#FFFFFF" />
  <circle cx="84" cy="44" r="7" fill="#FFFFFF" />
  <circle cx="64" cy="64" r="9" fill="#FFFFFF" />
  <circle cx="44" cy="84" r="7" fill="#FFFFFF" />
  <circle cx="84" cy="84" r="7" fill="#FFFFFF" />
</svg>
