server:
  port: 8081
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-second-brain

# 杩欓噷host鍦ㄦ湰鍦版祴璇曟椂鍙互杩炴帴鎴戠殑鏈満鏁版嵁搴?
  # IP锛?0.65.59.104
  #绔彛锛?306
  #璐﹀彿锛歞ev
  #瀵嗙爜锛?23456
# 閫夋嫨杩炴帴鑷繁鐨勬暟鎹簱锛岄渶瑕佸缓琛紝瀹屾暣寤鸿〃璇彞鍦╯ql鐩綍涓?

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:second_brain}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ai-second-brain-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      heartbeat-interval: 30000
      session-timeout: 900000
      max-poll-records: 1
      max-poll-interval: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3

  elasticsearch:
    enabled: ${ES_ENABLED:true}
    uris: http://localhost:9200
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:elastic123}
    connection-timeout: 5s
    socket-timeout: 30s

  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false

# ============================================================
# AI 鏈嶅姟鍟嗛厤缃紙@Deprecated 鈥?宸茶縼绉诲埌鏁版嵁搴撻┍鍔級
# 鏂版灦鏋勪笅鐢ㄦ埛閫氳繃銆屼釜浜鸿缃€嶉〉閰嶇疆鏈嶅姟鍟嗐€佹ā鍨嬪拰API Key锛?
# 閰嶇疆瀛樺偍鍦?ai_provider / ai_model / user_ai_config 琛ㄤ腑銆?
# 浠ヤ笅 application.yml 閰嶇疆浠呬綔涓烘棫璋冪敤鏂圭殑鍏滃簳锛岄€愭绉婚櫎銆?
# ============================================================
ai:
  # AES-256-GCM 瀵嗛挜锛岀敤浜庡姞瀵嗘暟鎹簱涓瓨鍌ㄧ殑鐢ㄦ埛 API Key
  encryption:
    key: ai-secondbrain-dev-key-32bytes!!

  # 鏄惁浣跨敤鏁版嵁搴撻┍鍔ㄧ殑鐢ㄦ埛AI閰嶇疆锛坱rue=鏂版灦鏋勶紝false=鏃pplication.yml閰嶇疆锛?
  use-new-config: ${AI_USE_NEW_CONFIG:true}

  # ---- 浠ヤ笅閰嶇疆宸插純鐢紝浠呯敤浜庢棫浠ｇ爜鍏煎 ----
  provider: ${AI_PROVIDER:qwen}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
    model: gpt-3.5-turbo
    embedding:
      api-key: ${OPENAI_API_KEY:}
      url: ${OPENAI_API_URL:https://api.openai.com/v1/embeddings}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-ada-002}
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    model: ${QWEN_MODEL:qwen-plus}
    embedding:
      api-key: ${QWEN_API_KEY:}
      url: ${QWEN_EMBEDDING_URL:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
      model: ${QWEN_EMBEDDING_MODEL:text-embedding-v2}

jwt:
  secret: ${JWT_SECRET:ai-second-brain-secret-key-2024-very-long-and-secure-key-for-jwt-token-generation-and-validation-256-bits-minimum}
  expiration: ${JWT_EXPIRATION:86400000}

wechat:
  # 微信小程序后台配置；未配置时接口会明确返回不可用，不会降级为伪登录。
  app-id: ${WECHAT_APP_ID:}
  app-secret: ${WECHAT_APP_SECRET:}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:thesecondbrain}

research:
  budget:
    max-tokens: ${RESEARCH_MAX_TOKENS:60000}
    max-tool-calls: ${RESEARCH_MAX_TOOL_CALLS:60}
    project-timeout-ms: ${RESEARCH_PROJECT_TIMEOUT_MS:600000}
  proxy:
    enabled: ${RESEARCH_PROXY_ENABLED:true}
    host: ${RESEARCH_PROXY_HOST:127.0.0.1}
    port: ${RESEARCH_PROXY_PORT:7890}
    type: ${RESEARCH_PROXY_TYPE:HTTP}

deerflow:
  api:
    url: ${DEERFLOW_API_URL:http://localhost:8000}
    timeout: ${DEERFLOW_API_TIMEOUT:300}
  local:
    enabled: ${DEERFLOW_LOCAL_ENABLED:true}
    learning-path-url: ${DEERFLOW_LOCAL_LEARNING_PATH_URL:http://localhost:8000}
    report-url: ${DEERFLOW_LOCAL_REPORT_URL:http://localhost:8000}
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${QWEN_MODEL:qwen-plus}

logging:
  level:
    com.secondbrain: debug
    org.springframework.web: info
    org.mybatis: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/ai-second-brain.log
    max-size: 10MB
    max-history: 30

