server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-second-brain

# 这里host在本地测试时可以连接我的本机数据库
  # IP：10.65.59.104
  #端口：3306
  #账号：dev
  #密码：123456
# 选择连接自己的数据库，需要建表，完整建表语句在sql目录下

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:second_brain}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ai-second-brain-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      heartbeat-interval: 30000
      session-timeout: 900000
      max-poll-records: 1
      max-poll-interval: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3

  elasticsearch:
    enabled: ${ES_ENABLED:true}
    uris: http://localhost:9200
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:elastic123}
    connection-timeout: 5s
    socket-timeout: 30s

  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false

# ============================================================
# AI 服务商配置（@Deprecated — 已迁移到数据库驱动）
# 新架构下用户通过「个人设置」页配置服务商、模型和API Key，
# 配置存储在 ai_provider / ai_model / user_ai_config 表中。
# 以下 application.yml 配置仅作为旧调用方的兜底，逐步移除。
# ============================================================
ai:
  # AES-256-GCM 密钥，用于加密数据库中存储的用户 API Key
  encryption:
    key: ai-secondbrain-dev-key-32bytes!!

  # 是否使用数据库驱动的用户AI配置（true=新架构，false=旧application.yml配置）
  use-new-config: ${AI_USE_NEW_CONFIG:true}

  # ---- 以下配置已弃用，仅用于旧代码兼容 ----
  provider: ${AI_PROVIDER:qwen}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
    model: gpt-3.5-turbo
    embedding:
      api-key: ${OPENAI_API_KEY:}
      url: ${OPENAI_API_URL:https://api.openai.com/v1/embeddings}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-ada-002}
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    model: ${QWEN_MODEL:qwen-plus}
    embedding:
      api-key: ${QWEN_API_KEY:}
      url: ${QWEN_EMBEDDING_URL:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
      model: ${QWEN_EMBEDDING_MODEL:text-embedding-v2}

jwt:
  secret: ${JWT_SECRET:ai-second-brain-secret-key-2024-very-long-and-secure-key-for-jwt-token-generation-and-validation-256-bits-minimum}
  expiration: ${JWT_EXPIRATION:86400000}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:thesecondbrain}

research:
  budget:
    max-tokens: ${RESEARCH_MAX_TOKENS:60000}
    max-tool-calls: ${RESEARCH_MAX_TOOL_CALLS:60}
    project-timeout-ms: ${RESEARCH_PROJECT_TIMEOUT_MS:600000}
  proxy:
    enabled: ${RESEARCH_PROXY_ENABLED:true}
    host: ${RESEARCH_PROXY_HOST:127.0.0.1}
    port: ${RESEARCH_PROXY_PORT:7890}
    type: ${RESEARCH_PROXY_TYPE:HTTP}

deerflow:
  api:
    url: ${DEERFLOW_API_URL:http://localhost:8000}
    timeout: ${DEERFLOW_API_TIMEOUT:300}
  local:
    enabled: ${DEERFLOW_LOCAL_ENABLED:true}
    learning-path-url: ${DEERFLOW_LOCAL_LEARNING_PATH_URL:http://localhost:8000}
    report-url: ${DEERFLOW_LOCAL_REPORT_URL:http://localhost:8000}
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${QWEN_MODEL:qwen-plus}

logging:
  level:
    com.secondbrain: debug
    org.springframework.web: info
    org.mybatis: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/ai-second-brain.log
    max-size: 10MB
    max-history: 30
