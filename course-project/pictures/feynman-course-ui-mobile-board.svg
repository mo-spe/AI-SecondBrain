  <rect width="1700" height="980" fill="#edf1ec"/>
  <text x="70" y="70" class="label">FEYNMAN COURSE / MOBILE RESPONSIVE BOARD 02</text>
  <text x="70" y="112" class="title">移动端：单手操作也能完成一次学习循环</text>
  <text x="70" y="140" class="subtitle">保留顶部身份感、底部主导航和大触控区域；内容滚动，核心动作始终清晰。</text>

  <!-- phone 1 -->
  <g transform="translate(70 190)" filter="url(#shadow)"><rect width="350" height="700" rx="36" fill="#f7f8f3"/><rect width="350" height="68" rx="36" fill="#102c27"/><rect y="34" width="350" height="34" fill="#102c27"/><circle cx="33" cy="33" r="18" fill="#bde9dc"/><text x="26" y="40" font-size="17" fill="#102c27">✣</text><text x="62" y="29" class="h3" fill="#fff">Feynman</text><text x="62" y="45" class="small" fill="#97b5ab">学习工作台</text><circle cx="315" cy="33" r="18" fill="#f4c875"/><text x="310" y="37" class="h3">W</text><g transform="translate(22 98)"><text class="label">周三 · 9月18日</text><text y="37" class="h2" font-size="27">早上好，Walliam。</text><text y="59" class="body">今天确认一次真正的理解。</text><rect y="83" width="306" height="42" rx="16" fill="#fff" stroke="#cbd8d2"/><text x="18" y="109" class="body">加载演示数据</text><rect y="137" width="306" height="42" rx="16" fill="#fff" stroke="#cbd8d2"/><text x="18" y="163" class="body">写下新知识　↗</text><g transform="translate(0 204)"><rect width="306" height="112" rx="20" fill="#eef3ee" stroke="#cbd8d2"/><text x="20" y="31" class="small">知识点总数</text><text x="20" y="76" class="h2" font-size="28">24</text><text x="20" y="98" class="small">继续让知识互相连接</text></g><g transform="translate(0 330)"><rect width="306" height="140" rx="22" fill="#c5eee2"/><text x="20" y="32" class="label">TODAY'S FOCUS</text><text x="20" y="67" class="h2">把一个概念讲清楚</text><text x="20" y="93" class="body">建议复述：向量数据库</text><rect x="20" y="108" width="108" height="27" rx="14" class="primary"/><text x="37" y="126" class="small" fill="#fff">开始复述　↗</text></g></g><g transform="translate(14 631)"><rect width="322" height="55" rx="21" fill="#fff" stroke="#cbd8d2"/><rect x="9" y="7" width="57" height="41" rx="16" class="mint"/><text x="24" y="25" class="small" fill="#087f72">▦</text><text x="14" y="40" class="small" fill="#087f72">学习概览</text><text x="90" y="25" class="small">▢</text><text x="82" y="40" class="small">我的知识</text><text x="168" y="25" class="small">♧</text><text x