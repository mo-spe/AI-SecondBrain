<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17342f" flood-opacity=".14"/></filter>
    <style>
      .title{font:700 32px 'Microsoft YaHei',Arial,sans-serif;fill:#132b27}.subtitle{font:400 15px 'Microsoft YaHei',Arial,sans-serif;fill:#64736e}.label{font:700 12px 'DM Mono','Consolas',monospace;fill:#087f72;letter-spacing:1px}.h2{font:700 20px 'Microsoft YaHei',Arial,sans-serif;fill:#132b27}.h3{font:700 13px 'Microsoft YaHei',Arial,sans-serif;fill:#132b27}.body{font:400 11px 'Microsoft YaHei',Arial,sans-serif;fill:#64736e}.small{font:400 9px 'Microsoft YaHei',Arial,sans-serif;fill:#64736e}.num{font:700 10px 'DM Mono','Consolas',monospace;fill:#be6c10}.line{stroke:#d4ded9;stroke-width:1}.primary{fill:#087f72}.mint{fill:#d7f3eb}.amber{fill:#f9e7c4}.ink{fill:#e2e9e3}
