  <!-- phone 3 -->
  <g transform="translate(870 190)" filter="url(#shadow)"><rect width="350" height="700" rx="36" fill="#f7f8f3"/><rect width="350" height="68" rx="36" fill="#102c27"/><rect y="34" width="350" height="34" fill="#102c27"/><circle cx="33" cy="33" r="18" fill="#bde9dc"/><text x="26" y="40" font-size="17" fill="#102c27">✣</text><text x="62" y="29" class="h3" fill="#fff">费曼复述</text><text x="62" y="45" class="small" fill="#97b5ab">FEYNMAN LOOP</text><circle cx="315" cy="33" r="18" fill="#f4c875"/><text x="310" y="37" class="h3">W</text><g transform="translate(22 98)"><text class="label">FEYNMAN LOOP / 02</text><text y="36" class="h2" font-size="27">用自己的话讲出来。</text><text y="59" class="body">先选知识点，再开始不看资料的解释。</text><rect y="84" width="306" height="136" rx="20" fill="#fff" stroke="#cbd8d2"/><text x="20" y="113" class="small">当前知识点</text><text x="20" y="145" class="h2" font-size="20">向量数据库</text><text x="20" y="174" class="body">上次掌握度 78%</text><rect y="242" width="306" height="236" rx="22" fill="#d7f3eb"/><text x="20" y="275" class="label">REPEAT WITHOUT NOTES</text><text x="20" y="315" class="h2">准备好了吗？</text><text x="20" y="345" class="body">用 60 秒讲清楚：</text><text x="20" y="370" class="h3">“它解决了什么问题？”</text><circle cx="153" cy="424" r="31" class="primary"/><text x="142" y="434" font-size="22" fill="#fff">♩</text></g><g transform="translate(14 631)"><rect width="322" height="55" rx="21" fill="#fff" stroke="#cbd8d2"/><rect x="145" y="7" width="57" height="41" rx="16" class="mint"/><text x="161" y="25" class="small" fill="#087f72">♧</text><text x="151" y="40" class="small" fill="#087f72">费曼复述</text><text x="24" y="25" class="small">▦</text><text x="11" y="40" class="small">概览</text><text x="88" y="25" class="small">▢</text><text x="75" y="40" class="small">知识</text><text x="248" y="25" class="small">☑</text><text x="235" y="40" class="small">测验</text></g></g>
  <text x="870" y="927" class="label">M03 / EXPLAIN</text>

  <!-- phone 4 -->
  <g transform="translate(1270 190)" filter="url(#shadow)"><rect width="350" height="700" rx="36" fill="#f7f8f3"/><rect width="350" height="68" rx="36" fill="#102c27"/><rect y="34" width="350" height="34" fill="#102c27"/><circle cx="33" cy="33" r="18" fill="#bde9dc"/><text x="26" y="40" font-size="17" fill="#102c27">✣</text><text x="62" y="29" class="h3" fill="#fff">智能测验</text><text x="62" y="45" class="small" fill="#97b5ab">SMART QUIZ</text><circle cx="315" cy="33" r="18" fill="#f4c875"/><text x="310" y="37" class="h3">W</text><g transform="translate(22 98)"><text class="label">SMART QUIZ / 01</text><text y="36" class="h2" font-size="27">把理解变成一次小测。</text><text y="59" class="body">答案会被记录进学习循环。</text><text x="270" y="17" class="num">01/05</text><rect y="84" width="306" height="6" rx="3" fill="#d7e3dd"/><rect y="84" width="61" height="6" rx="3" class="primary"/><rect y="112" width="306" height="160" rx="20" fill="#fff" stroke="#cbd8d2"/><text x="20" y="141" class="small">向量数据库 · 基础概念</text><text x="20" y="176" class="h2" font-size="17">为什么需要进行向量化？</text><text x="20" y="205" class="body">选择最能解释语义检索的答案。</text><rect y="294" width="306" height="42" rx="15" fill="#fff" stroke="#087f72"/><circle cx="23" cy="315" r="9" class="mint"/><text x="42" y="320" class="body">A　让文本更容易被理解</text><rect y="348" width="306" height="42" rx="15" fill="#fff" stroke="#087f72"/><circle cx="23" cy="369" r="9" class="mint"/><text x="42" y="374" class="body">B　支持相似语义的检索</text><rect y="412" width="140" height="35" rx="18" class="primary"/><text x="52" y="434" class="small" fill="#fff">提交答案　↗</text></g><g transform="translate(14 631)"><rect width="322" height="55" rx="21" fill="#fff" stroke="#cbd8d2"/><rect x="218" y="7" width="57" height="41" rx="16" class="mint"/><text x="234" y="25" class="small" fill="#087f72">☑</text><text x="224" y="40" class="small" fill="#087f72">智能测验</text><text x="24" y="25" class="small">▦</text><text x="11" y="40" class="small">概览</text><text x="88" y="25" class="small">▢</text><text x="75" y="40" class="small">知识</text><text x="168" y="25" class="small">♧</text><text x="155" y="40" class="small">复述</text></g></g>
