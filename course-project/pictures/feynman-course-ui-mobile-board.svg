  <text x="70" y="927" class="label">M01 / HOME</text>

  <!-- phone 2 -->
  <g transform="translate(470 190)" filter="url(#shadow)"><rect width="350" height="700" rx="36" fill="#f7f8f3"/><rect width="350" height="68" rx="36" fill="#102c27"/><rect y="34" width="350" height="34" fill="#102c27"/><circle cx="33" cy="33" r="18" fill="#bde9dc"/><text x="26" y="40" font-size="17" fill="#102c27">✣</text><text x="62" y="29" class="h3" fill="#fff">我的知识</text><text x="62" y="45" class="small" fill="#97b5ab">KNOWLEDGE BASE</text><circle cx="315" cy="33" r="18" fill="#f4c875"/><text x="310" y="37" class="h3">W</text><g transform="translate(22 98)"><text class="label">KNOWLEDGE BASE / 01</text><text y="36" class="h2" font-size="27">我的知识。</text><text y="59" class="body">值得被再次讲清楚的东西。</text><rect y="83" width="306" height="42" rx="16" fill="#fff" stroke="#cbd8d2"/><text x="18" y="109" class="body">⌕　搜索知识点</text><text x="252" y="109" class="small">24 条</text><rect y="141" width="306" height="80" rx="18" fill="#fff" stroke="#d4ded9"/><rect x="16" y="19" width="35" height="35" rx="12" class="mint"/><text x="27" y="42" font-size="17" fill="#087f72">▢</text><text x="67" y="34" class="h3">向量数据库</text><text x="67" y="52" class="small">AI / 数据库</text><rect x="67" y="61" width="82" height="17" rx="9" class="mint"/><text x="78" y="73" class="small" fill="#087f72">掌握度 78%</text><rect y="235" width="306" height="80" rx="18" fill="#fff" stroke="#d4ded9"/><rect x="16" y="19" width="35" height="35" rx="12" class="amber"/><text x="27" y="42" font-size="17" fill="#be6c10">♧</text><text x="67" y="34" class="h3">费曼学习法</text><text x="67" y="52" class="small">学习方法</text><rect x="67" y="61" width="61" height="17" rx="9" fill="#fff2df"/><text x="78" y="73" class="small" fill="#be6c10">待复述</text><rect y="329" width="306" height="80" rx="18" fill="#fff" stroke="#d4ded9"/><rect x="16" y="19" width="35" height="35" rx="12" class="ink"/><text x="27" y="42" font-size="17" fill="#087f72">✦</text><text x="67" y="34" class="h3">检索增强生成</text><text x="67" y="52" class="small">AI / RAG</text></g><g transform="translate(14 631)"><rect width="322" height="55" rx="21" fill="#fff" stroke="#cbd8d2"/><rect x="72" y="7" width="57" height="41" rx="16" class="mint"/><text x="88" y="25" class="small" fill="#087f72">▢</text><text x="79" y="40" class="small" fill="#087f72">我的知识</text><text x="24" y="25" class="small">▦</text><text x="11" y="40" class="small">概览</text><text x="168" y="25" class="small">♧</text><text x="155" y="40" class="small">复述</text><text x="248" y="25" class="small">☑</text><text x="235" y="40" class="small">测验</text></g></g>
