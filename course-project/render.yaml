services:
  - type: web
    name: feynman-course
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: SERVE_WEB
        value: "true"
      - key: CLIENT_ORIGIN
        value: '*'
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_CHAT_MODEL
        value: gpt-4o-mini
      - key: AI_TIMEOUT_MS
        value: 30000
