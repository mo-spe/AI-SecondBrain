services:
  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 4000
      SERVE_WEB: "false"
      CLIENT_ORIGIN: ${COURSE_CLIENT_ORIGIN:-http://localhost:8088}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${COURSE_WEB_PORT:-8088}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
