version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: ai-brain-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: second_brain
      MYSQL_USER: secondbrain
      MYSQL_PASSWORD: brain123456
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"  # 映射到3307端口，避免与本地MySQL冲突
    volumes:
      # MySQL 会按 /docker-entrypoint-initdb.d/ 下文件名字典序执行，
      # 故用数字前缀固定顺序：基础表 → V7(AI配置) → V8(待确认) → V9(题目池)
      - ai-brain-mysql-data:/var/lib/mysql
      - ./sql/second_brain.sql:/docker-entrypoint-initdb.d/01-second_brain.sql:ro
      - ./sql/V7__add_ai_provider_tables.sql:/docker-entrypoint-initdb.d/02-V7__add_ai_provider_tables.sql:ro
      - ./sql/V8__add_pending_knowledge.sql:/docker-entrypoint-initdb.d/03-V8__add_pending_knowledge.sql:ro
      - ./sql/V9__add_review_card_pool.sql:/docker-entrypoint-initdb.d/04-V9__add_review_card_pool.sql:ro
    networks:
      - ai-brain-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: ai-brain-redis
    ports:
      - "6379:6379"
    volumes:
      - ai-brain-redis-data:/data
      - ./redis/redis-clean.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - ai-brain-network
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ai-brain-mysql-data:
    driver: local
  ai-brain-redis-data:
    driver: local

networks:
  ai-brain-network:
    driver: bridge
